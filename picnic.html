<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picnic post</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body class="summer-picnic-page">
    <main class="summer-poster">
        <h1 class="poster-heading">
            <span>SUMMER</span>
            <br>
            <span>PICNIC</span>
        </h1>
        <h2 class="heading-subtitle">
        IN THE PARK</h2>
        <p class="poster-message">
            RELAX AND ENJOY<br>
            THE OUTDOORS
        </p>
            
        <div class="poster-date">
            <img src="image/ribon.png" alt="decorative-date-ribbon" width="400">
            <p>27 July | 12 P.M.</p>
        </div>
        <div class="poster-address">
            <p>
                123 Anywhere St.,
            </p>
            <p>
                Any city, St 12345
            </p>
            <p>www.realgreatsite.com</p>
        </div>
    </main>
    
</body>
</html>
